<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>诊断模式 - 广州英语</title>
    <style>
:root {
  --primary: #4ecdc4;       /* 薄荷绿 */
  --secondary: #ff6b6b;     /* 珊瑚粉 */
  --accent: #ffe66d;        /* 暖黄 */
  --bg: #f7fff7;            /* 极淡绿背景 */
  --text-main: #2f3e46;
  --text-sub: #8395a7;
  --card-bg: #ffffff;
  --shadow: 0 10px 25px rgba(78, 205, 196, 0.15);
  --radius: 24px;
  --radius-sm: 12px;
  --radius-lg: 32px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  overflow-x: hidden;
}

.wrap {
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 16px 16px 100px;
}

/* Header Design */
.hd {
  background: white;
  padding: 24px 20px 16px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  text-align: center;
  margin-bottom: 24px;
}

.hd-t {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 16px;
}

.hd-t span {
  font-size: 24px;
  font-weight: 800;
  color: var(--primary);
}

.hd-t small {
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 4px;
}

/* Progress Bar */
.progress-container {
  width: 100%;
  height: 8px;
  background: #eef2f3;
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #a8e6cf);
  transition: width 0.4s ease;
}

/* Tabs: 学期切换 (7A, 7B...) */
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0;
  scrollbar-width: none;
  margin-bottom: 16px;
}
.tabs::-webkit-scrollbar { display: none; }

.tabs button {
  flex: 0 0 auto;
  border: 2px solid #f0f4f5;
  background: #fbfcfc;
  color: var(--text-sub);
  padding: 8px 16px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.tabs button.on {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(78, 205, 196, 0.3);
}

/* Mode Switch: 背单词/语法 */
.mode-switch {
  display: inline-flex;
  background: #f0f4f5;
  padding: 4px;
  border-radius: 50px;
}

.mode-pill {
  border: none;
  background: none;
  padding: 8px 16px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 14px;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.3s;
}

.mode-pill.on {
  background: white;
  color: var(--primary);
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

/* Main Content */
.main-content {
  margin-top: 8px;
}

/* Unit Selector - Grid Style */
.selector-area {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.sel-btn {
  aspect-ratio: 1/1;
  border: none;
  background: white;
  border-radius: var(--radius-sm);
  box-shadow: 0 4px 10px rgba(0,0,0,0.04);
  font-weight: 800;
  font-size: 16px;
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sel-btn.on {
  background: var(--accent);
  color: #5e4d00;
  transform: scale(1.05);
}

/* Word Card - The Heart of the App */
.content-pane {
  min-height: 320px;
}

.card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 40px 24px;
  box-shadow: var(--shadow);
  text-align: center;
  animation: popin 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.word-card .w {
  font-size: 48px;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 4px;
  display: block;
}

.word-card .p {
  font-size: 20px;
  color: var(--primary);
  margin-bottom: 24px;
  display: block;
  font-style: italic;
}

.word-card .m {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 30px;
  display: block;
}

.word-card .example {
  background: #f9fbfb;
  padding: 16px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  color: var(--text-sub);
  line-height: 1.5;
  text-align: left;
  border-left: 4px solid var(--primary);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-sub);
}

.empty-icon {
  font-size: 64px;
  margin-bottom: 16px;
  display: block;
}

/* Footer */
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 16px;
  text-align: center;
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  box-shadow: 0 -10px 25px rgba(0,0,0,0.05);
  z-index: 100;
}

.footer-info {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 4px;
}

.footer-hint {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
}

/* Animations */
@keyframes popin {
  0% { opacity: 0; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1); }
}


/* --- EMERGENCY VISIBILITY FIX --- */
#app, body, .wrap { display: block !important; visibility: visible !important; opacity: 1 !important; }


/* --- EMERGENCY UNHIDE --- */
#app, body, .wrap, .main-content, .content-pane { display: block !important; visibility: visible !important; opacity: 1 !important; }


/* --- EMERGENCY UNHIDE --- */
#app, body, .wrap, .main-content, .content-pane, .selector-area { display: block !important; visibility: visible !important; opacity: 1 !important; }

#debug-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #f7fff7; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10000;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.status-card {
    background: white; padding: 30px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 80%; max-width: 400px;
}
.progress-container { width: 100%; background: #eee; height: 10px; border-radius: 5px; margin: 20px 0; overflow: hidden; }
.progress-bar { width: 0%; height: 100%; background: #4ecdc4; transition: width 0.3s ease; }
.error-msg { color: #ff4444; font-weight: bold; margin-top: 20px; }
    </style>
</head>

// app.js — 广州初中英语 · 沪教版 (艾宾浩斯算法版 + 规律学习模式)
(function() {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  // --- 调试工具 ---
  function showErrorToUI(msg, error) {
    let errDiv = $("#debug-error");
    if (!errDiv) {
      errDiv = document.createElement('div');
      errDiv.id = 'debug-error';
      errDiv.style = "position:fixed;top:0;left:0;width:100%;background:rgba(255,0,0,0.9);color:white;z-index:9999;padding:15px;font-family:monospace;font-size:12px;overflow:auto;max-height:40%;";
      document.body.prepend(errDiv);
    }
    errDiv.innerHTML = `<strong style="font-size:16px">❌ App Error:</strong><br>${msg}<br><hr><pre style="white-space:pre-wrap;word-break:break-all;">${error?.stack || error}</pre>`;
    console.error("App Error:", msg, error);
  }

  // --- 状态管理 ---
  let state = {
    currentGrade: "7A",
    currentUnit: null,
    mode: "word", 
    progress: 0,
    reviewQueue: [],
    currentWordList: [],
    currentIndex: 0,
    currentWord: null,
    patternId: null 
  };

  let memoryMap = {};
  let patternsData = [];

  // --- 初始化 ---
  document.addEventListener('DOMContentLoaded', () => {
    try {
      if (typeof WORDS === 'undefined') throw new Error("WORDS 数据加载失败");
      
      if (typeof PATTERNS !== 'undefined') {
        patternsData = PATTERNS;
        console.log("Patterns loaded:", patternsData);
      } else {
        console.warn("PATTERNS 未找到");
      }

      loadMemory();
      initTabs();
      initModeSwitch();
      updateProgressDisplay();
      
    } catch (e) {
      showErrorToUI("应用启动失败", e);
    }
  });

  function loadMemory() {
    const saved = localStorage.getItem('guangzhou_eng_memory');
    if (saved) {
      try { memoryMap = JSON.parse(saved); } catch (e) { memoryMap = {}; }
    }
  }

  function saveMemory() {
    try { localStorage.setItem('guangzhou_eng_memory', JSON.stringify(memoryMap)); } catch (e) { console.error(e); }
  }

  // --- UI 逻辑 ---
  function initTabs() {
    const tabs = $("#grade-tabs");
    if (!tabs) return;
    tabs.innerHTML = '';
    const grades = Object.keys(WORDS).sort();
    grades.forEach(g => {
      const btn = document.createElement('button');
      btn.innerText = g;
      btn.onclick = () => setGrade(g);
      if (g === state.currentGrade) btn.classList.add('on');
      tabs.appendChild(btn);
    });
  }

  function initModeSwitch() {
    const btnWord = $("#btn-word");
    const btnGrammar = $("#btn-grammar");
    const btnPattern = $("#btn-pattern");
    if (btnWord) btnWord.onclick = () => setMode('word');
    if (btnGrammar) btnGrammar.onclick = () => setMode('grammar');
    if (btnPattern) btnPattern.onclick = () => setMode('pattern');
  }

  function setGrade(g) {
    state.currentGrade = g;
    state.currentUnit = null;
    state.patternId = null;
    $$("#grade-tabs button").forEach(b => {
      b.classList.toggle('on', b.innerText === g);
    });
    renderUnitSelector();
    renderMain();
  }

  function setMode(m) {
    state.mode = m;
    state.patternId = null;
    $("#btn-word").classList.toggle('on', m === 'word');
    $("#btn-grammar").classList.toggle('on', m === 'grammar');
    $("#btn-pattern").classList.toggle('on', m === 'pattern');
    
    const unitSelector = $("#unit-selector");
    if (unitSelector) {
        unitSelector.style.display = (m === 'grammar' || m === 'pattern') ? 'none' : 'flex';
    }
    
    renderMain();
  }

  function setUnit(u) {
    try {
      state.currentUnit = u;
      state.patternId = null;
      $$(".sel-btn").forEach(b => {
        const btnUnit = b.dataset.unit;
        b.classList.toggle('on', String(btnUnit) === String(u));
      });
      prepareQueue();
      renderMain();
    } catch (e) {
      showErrorToUI("切换单元失败", e);
    }
  }

  // --- 单词队列逻辑 ---
  function prepareQueue() {
    try {
      let allWordsData = WORDS[state.currentGrade] || [];
      const targetUnit = String(state.currentUnit);
      let targetWords = [];

      if (Array.isArray(allWordsData)) {
        targetWords = allWordsData;
      } else if (typeof allWordsData === 'object' && allWordsData !== null) {
        Object.values(allWordsData).forEach(uList => {
            if (Array.isArray(uList)) targetWords.push(...uList);
        });
      }

      const unitWords = targetWords.filter(w => {
        const wu = String(w.u || "");
        return wu === targetUnit || wu.startsWith(targetUnit + ".");
      });
      
      const now = Date.now();
      const reviewList = [];
      const learningList = [];

      unitWords.forEach(word => {
        const key = `${state.currentGrade}_${word.u}_${word.w}`;
        const mem = memoryMap[key];
        if (mem && mem.nextReview <= now) {
          reviewList.push(word);
        } else {
          learningList.push(word);
        }
      });

      const shuffledReview = reviewList.sort(() => Math.random() - 0.5);
      const shuffledLearning = learningList.sort(() => Math.random() - 0.5);
      
      state.reviewQueue = [...shuffledReview, ...shuffledLearning];
      state.currentWordList = [...state.reviewQueue];
      state.currentIndex = 0;
      state.currentWord = state.currentWordList.length > 0 ? state.currentWordList[0] : null;
      
      const masteredCount = unitWords.filter(w => {
        const key = `${state.currentGrade}_${w.u}_${w.w}`;
        return memoryMap[key] && memoryMap[key].level > 0;
      }).length;
      
      state.progress = unitWords.length > 0 ? (masteredCount / unitWords.length) * 100 : 0;
      updateProgressDisplay();
    } catch (e) {
      showErrorToUI("准备队列时崩溃", e);
    }
  }

  function getNextWord() {
    if (state.currentIndex >= 0 && state.currentIndex < state.currentWordList.length) {
      return state.currentWordList[state.currentIndex];
    }
    return null;
  }

  // --- 渲染逻辑 ---
  function renderUnitSelector() {
    const area = $("#unit-selector");
    if (!area) return;
    area.innerHTML = '';
    if (state.mode === 'grammar' || state.mode === 'pattern') {
        area.style.display = 'none';
        return;
    }
    area.style.display = 'flex';

    try {
      let allWordsData = WORDS[state.currentGrade] || [];
      const units = [];
      if (Array.isArray(allWordsData)) {
        const unitSet = new Set(allWordsData.map(w => w.u).filter(u => u !== undefined && u !== null));
        unitSet.forEach(u => units.push(String(u)));
      } else if (typeof allWordsData === 'object' && allWordsData !== null) {
        Object.keys(allWordsData).forEach(u => units.push(u));
      }

      units.sort((a, b) => {
        const na = parseInt(String(a).replace(/[^0-9]/g, '')) || 0;
        const nb = parseInt(String(b).replace(/[^0-9]/g, '')) || 0;
        return na - nb;
      });
      
      if (units.length === 0) {
        area.innerHTML = '<p style="color:var(--text-sub); font-size:14px;">暂无单词数据</p>';
        return;
      }

      units.forEach(u => {
        const btn = document.createElement('button');
        btn.className = 'sel-btn';
        btn.innerText = `U${u}`;
        btn.dataset.unit = u;
        btn.onclick = (e) => { e.preventDefault(); setUnit(u); };
        if (String(state.currentUnit) === String(u)) btn.classList.add('on');
        area.appendChild(btn);
      });
    } catch (e) {
      showErrorToUI("渲染单元区域崩溃", e);
    }
  }

  function renderMain() {
    const pane = $("#main-pane");
    if (!pane) return;
    pane.innerHTML = '';

    if (state.mode === 'word') {
      if (!state.currentUnit) {
        pane.innerHTML = `<div class="empty-state animate-pop"><div class="empty-icon">👋</div><p>请从上方选择一个单元开始学习吧！</p></div>`;
      } else {
        renderWordCard(pane);
      }
    } else if (state.mode === 'grammar') {
      renderGrammarList(pane);
    } else if (state.mode === 'pattern') {
      renderPatternMode(pane);
    }
  }

  // --- 单词卡片渲染 ---
  function renderWordCard(pane) {
    try {
      const word = getNextWord();
      if (!word) {
        pane.innerHTML = `
          <div class="card animate-pop" style="padding: 40px 20px; text-align:center;">
            <div style="font-size: 50px; margin-bottom: 15px;">🎉</div>
            <h3 style="margin:0">学习完成！</h3>
            <p style="color:var(--text-sub)">本单元单词已全部完成复习</p>
            <button onclick="location.reload()" style="margin-top:20px; background:var(--primary); color:white; border:none; padding:10px 25px; border-radius:50px; font-weight:700;">重新开始</button>
          </div>`;
        return;
      }
      const key = `${state.currentGrade}_${word.u}_${word.w}`;
      const mem = memoryMap[key] || { level: 0, nextReview: 0 };
      const card = document.createElement('div');
      card.className = 'card word-card animate-pop';
      const displayW = word.w || "???";
      const displayP = word.p || "";
      const displayM = word.m || "";
      const displayE = (Array.isArray(word.e) && word.e.length > 0) ? word.e[0] : "暂无例句";
      card.innerHTML = `
        <span class="w">${displayW}</span><span class="p">${displayP}</span><span class="m">${displayM}</span>
        <div class="example">${displayE}</div>
        <div style="font-size:12px; color:var(--text-sub); margin-top:10px; text-align:center;">进度: ${state.currentIndex + 1} / ${state.currentWordList.length}</div>
        <div style="margin-top:20px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
          <button id="btn-prev" class="action-btn" style="background:#95a5a6; color:white; border:none; padding:8px 15px; border-radius:50px; font-weight:700;">上一个</button>
          <button id="btn-wrong" class="action-btn" style="background:#ff6b6b; color:white; border:none; padding:8px 15px; border-radius:50px; font-weight:700;">记不住 ❌</button>
          <button id="btn-right" class="action-btn" style="background:#4ecdc4; color:white; border:none; padding:8px 15px; border-radius:50px; font-weight:700;">掌握了 ✅</button>
          <button id="btn-next" class="action-btn" style="background:#95a5a6; color:white; border:none; padding:8px 15px; border-radius:50px; font-weight:700;">下一个</button>
        </div>`;
      pane.appendChild(card);
      card.querySelector("#btn-prev").onclick = () => { if (state.currentIndex > 0) { state.currentIndex--; renderMain(); } };
      card.querySelector("#btn-next").onclick = () => { if (state.currentIndex < state.currentWordList.length - 1) { state.currentIndex++; renderMain(); } else { renderMain(); } };
      card.querySelector("#btn-wrong").onclick = () => {
        mem.level = Math.max(0, mem.level - 1);
        mem.nextReview = Date.now() + (24 * 60 * 60 * 1000);
        memoryMap[key] = mem; saveMemory(); renderMain();
      };
      card.querySelector("#btn-right").onclick = () => {
        mem.level = Math.min(6, mem.level + 1);
        const days = [0, 1, 2, 4, 7, 15, 30][mem.level];
        mem.nextReview = Date.now() + (days * 24 * 60 * 60 * 1000);
        memoryMap[key] = mem; saveMemory();
        const allWords = WORDS[state.currentGrade] || [];
        let unitWords = Array.isArray(allWords) ? allWords.filter(w => String(w.u) === String(state.currentUnit)) : (allWords[state.currentUnit] || []);
        const masteredCount = unitWords.filter(w => {
          const k = `${state.currentGrade}_${w.u}_${w.w}`;
          return memoryMap[k] && memoryMap[k].level > 0;
        }).length;
        state.progress = unitWords.length > 0 ? (masteredCount / unitWords.length) * 100 : 0;
        updateProgressDisplay();
        if (state.currentIndex < state.currentWordList.length - 1) { state.currentIndex++; renderMain(); } else { renderMain(); }
      };
    } catch (e) { showErrorToUI("渲染单词卡片时崩溃", e); }
  }

  // --- 语法逻辑 ---
  function renderGrammarList(pane) {
    try {
      const grammarModules = GRAMMAR_BY_GRADE[state.currentGrade] || [];
      if (grammarModules.length === 0) {
        pane.innerHTML = `<div class="empty-state animate-pop"><div class="empty-icon">📚</div><p>该年级暂无语法知识点。</p></div>`;
        return;
      }
      const container = document.createElement('div');
      container.className = 'grammar-container';
      container.style.cssText = 'display:flex; flex-direction:column; gap:15px; padding:10px 0;';
      container.innerHTML = `<h3 style="margin:10px 0; padding-left:10px; color:var(--text-main)">${state.currentGrade} 核心语法知识点</h3>`;
      grammarModules.forEach(key => {
        const data = GRAMMAR[key];
        if (!data) return;
        const item = document.createElement('div');
        item.className = 'card animate-pop';
        item.style.cssText = 'cursor:pointer; padding:20px; position:relative; border-left:6px solid var(--primary);';
        item.innerHTML = `<h4 style="margin:0 0 5px 0; font-size:18px; color:var(--primary);">${data.title}</h4><p style="margin:0; font-size:14px; color:var(--text-sub);">${data.desc}</p><div style="position:absolute; right:15px; top:50%; transform:translateY(-50%); font-size:20px; color:#ddd;">📖</div>`;
        item.onclick = () => renderGrammarDetail(data);
        container.appendChild(item);
      });
      pane.appendChild(container);
    } catch (e) { showErrorToUI("渲染语法列表时崩溃", e); }
  }

  function renderGrammarDetail(data) {
    const pane = $("#main-pane");
    pane.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card animate-pop';
    card.style.cssText = 'padding:25px;';
    const rulesHtml = data.rules.map(r => `<li>${r}</li>`).join('');
    const examplesHtml = data.example.map(ex => `<div>${ex}</div>`).join('');
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0; color:var(--primary); font-size:22px;">${data.title}</h3>
        <button id="btn-back-grammar" style="background:none; border:none; font-size:24px; cursor:pointer;">⬅️</button>
      </div>
      <p style="font-size:16px; color:var(--text-main); line-height:1.5; margin-bottom:20px;">${data.desc}</p>
      <div style="margin-bottom:25px;"><h4 style="margin:0 0 10px 0; font-size:16px; color:var(--text-sub);">💡 核心规则</h4><ul style="padding-left:20px; margin:0; line-height:1.6; color:var(--text-main);">${rulesHtml}</ul></div>
      <div style="margin-bottom:25px;"><h4 style="margin:0 0 10px 0; font-size:16px; color:var(--text-sub);">📝 例句示范</h4><div style="background:rgba(108, 197, 163, 0.1); padding:15px; border-radius:12px; line-height:1.6; color:var(--text-main);">${examplesHtml}</div></div>
      ${data.note ? `<div style="background:#fff3cd; padding:12px; border-radius:8px; font-size:14px; color:#856404;"><strong style="color:#856404">⚠️ 注意：</strong><br>${data.note}</div>` : ''}
    `;
    pane.appendChild(card);
    card.querySelector("#btn-back-grammar").onclick = () => renderMain();
  }

  // --- 规律模式逻辑 (Pattern Mode) ---
  function renderPatternMode(pane) {
    if (!patternsData || patternsData.length === 0) {
      pane.innerHTML = `<div class="empty-state animate-pop"><div class="empty-icon">⏳</div><p>规律数据加载中...</p></div>`;
      return;
    }

    if (!state.patternId) {
      const container = document.createElement('div');
      container.className = 'grammar-container';
      container.style.cssText = 'display:flex; flex-direction:column; gap:15px; padding:10px 0;';
      container.innerHTML = `<h3 style="margin:10px 0; padding-left:10px; color:var(--text-main)">💡 规律学习：选择一个维度</h3>`;

      patternsData.forEach(p => {
        const item = document.createElement('div');
        item.className = 'card animate-pop';
        item.style.cssText = 'cursor:pointer; padding:20px; position:relative; border-left:6px solid var(--primary);';
        item.innerHTML = `<h4 style="margin:0 0 5px 0; font-size:18px; color:var(--primary);">${p.title}</h4><p style="margin:0; font-size:14px; color:var(--text-sub);">${p.desc}</p><div style="position:absolute; right:15px; top:50%; transform:translateY(-50%); font-size:20px; color:#ddd;">🔍</div>`;
        item.onclick = () => { 
            console.log("Pattern Selected:", p);
            state.patternId = p.id; 
            renderPatternWordsBySelection(p); 
        };
        container.appendChild(item);
      });
      pane.appendChild(container);
    } else {
      renderPatternWordsBySelection(pane);
    }
  }

  function renderPatternWordsBySelection(pane) {
    const pattern = patternsData.find(p => p.id === state.patternId);
    if (!pattern) {
        state.patternId = null;
        renderMain();
        return;
    }

    console.log("Pattern Matcher Running for:", pattern.title, "Pattern:", pattern.pattern, "Type:", pattern.type);

    const matchedWords = [];
    const gradeData = WORDS[state.currentGrade] || {};
    const allWords = [];

    // Step 1: Robust flattened word extraction
    if (Array.isArray(gradeData)) {
      allWords.push(...gradeData);
    } else if (typeof gradeData === 'object' && gradeData !== null) {
      Object.keys(gradeData).forEach(key => {
        const val = gradeData[key];
        if (Array.isArray(val)) {
          allWords.push(...val);
        } else if (typeof val === 'object' && val !== null) {
          Object.values(val).forEach(innerList => {
            if (Array.isArray(innerList)) allWords.push(...innerList);
          });
        }
      });
    }
    
    console.log(`Words extracted for grade ${state.currentGrade}: ${allWords.length}`);

    // Step 2: Advanced Matching Engine
    allWords.forEach(w => {
      let isMatch = false;
      const wStr = (w.w || "").toLowerCase().trim();
      const pStr = (pattern.pattern || "").toLowerCase().trim();

      if (pattern.type === 'suffix') {
          if (wStr.endsWith(pStr)) isMatch = true;
      } else if (pattern.type === 'prefix') {
          if (wStr.startsWith(pStr)) isMatch = true;
      } else if (pattern.type === 'phrase') {
          if (wStr.includes(pStr)) isMatch = true;
      } else if (pattern.type === 'exact') {
          if (wStr === pStr || wStr.includes(pStr)) isMatch = true;
      }
      if (isMatch) matchedWords.push(w);
    });

    console.log(`Final Match Count for ${pattern.id}: ${matchedWords.length}`);

    const container = document.createElement('div');
    container.className = 'grammar-container';
    container.style.cssText = 'display:flex; flex-direction:column; gap:15px; padding:10px 0;';
    container.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="btn-back-pattern" style="background:none; border:none; font-size:20px; cursor:pointer;">⬅️</button>
        <h3 style="margin:0; color:var(--text-main)">${pattern.title} 单词列表</h3>
      </div>
      <p style="font-size:14px; color:var(--text-sub); padding-left:10px;">共找到 ${matchedWords.length} 个匹配单词</p>
    `;

    if (matchedWords.length === 0) {
        container.innerHTML += `<div class="empty-state animate-pop" style="padding:40px 0;"><p>暂无匹配单词</p><div style="font-size:30px;">🔍</div></div>`;
    } else {
        matchedWords.forEach(word => {
            const item = document.createElement('div');
            item.className = 'card animate-pop';
            item.style.cssText = 'cursor:pointer; padding:15px; display:flex; justify-content:space-between; align-items:center;';
            item.innerHTML = `<div><strong style="font-size:18px;">${word.w}</strong><div style="font-size:13px; color:var(--text-sub);">${word.p}</div></div><div style="color:var(--primary); font-size:14px;">学习 📖</div>`;
            item.onclick = () => {
                console.log("Word clicked:", word);
                state.mode = 'word';
                state.currentUnit = word.u;
                state.currentWordList = [word];
                state.currentIndex = 0;
                state.currentWord = word;
                
                // Sync UI
                $$("#btn-word").classList.add('on');
                $$("#btn-grammar").classList.remove('on');
                $$("#btn-pattern").classList.remove('on');
                $("#unit-selector").style.display = 'flex';
                renderMain();
                renderWordCard(pane);
            };
            container.appendChild(item);
        });
    }
    pane.appendChild(container);
    container.querySelector("#btn-back-pattern").onclick = () => { state.patternId = null; renderMain(); };
  }

  // --- 通用工具 ---
  function updateProgressDisplay() {
    const progressEl = $("#progress-bar");
    const dayProgressEl = $("#day-progress");
    if (progressEl) progressEl.style.width = (state.progress || 0) + '%';
    if (dayProgressEl) dayProgressEl.innerText = Math.round(state.progress || 0) + '%';
  }

})();


                // If we reach here, the engine is running.
                document.getElementById('debug-overlay').style.display = 'none';
            } catch (e) {
                showError("引擎启动逻辑错误: " + e.message);
            }
        }, 500);

    } catch (e) {
        showError("数据解析崩溃: " + e.message + "\n\n可能原因: 数据格式损坏或内存不足");
        console.error(e);
    }

    // Global error capture
    window.onerror = function(m, s, l, c, e) {
        showError("运行时崩溃: " + m + " (行号: " + l + ")");
        return true;
    };
    </script>
